<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATLAS Threat Intelligence</title>
    <meta name="description" content="Synthetic intelligence investigation dashboard" />
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">ATLAS</div>
          <div>
            <p class="brand-kicker">Threat Intelligence</p>
          </div>
        </div>

        <nav class="side-nav" aria-label="Primary navigation">
          <button class="nav-item active" data-nav="overview">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
            <span>Overview</span>
          </button>
          <button class="nav-item" data-nav="evidence">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span>
            <span>Evidence Intelligence</span>
          </button>
          <button class="nav-item" data-nav="actors">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="16" r="3"/><path d="M10.5 9.5 14.5 14.5M4 19c0-3 2-5 5-5M15 5h5v5"/></svg></span>
            <span>Attribution &amp; Identity</span>
          </button>
          <button class="nav-item" data-nav="personas">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.5 3.1-5.5 7-5.5s6.2 2 7 5.5M4 8h2M18 8h2M12 2v2M12 18v3"/></svg></span>
            <span>AI Persona Intelligence</span>
          </button>
          <button class="nav-item" data-nav="reliability">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 8 3v5c0 5-3.3 8.3-8 10-4.7-1.7-8-5-8-10V6z"/><path d="m8 12 2.5 2.5L16 9"/></svg></span>
            <span>Attribution Reliability</span>
          </button>
          <button class="nav-item" data-nav="graph">
            <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="m10 10-3.5-2.5M14 10l3.5-2.5M15 14l2.5 2.5"/></svg></span>
            <span>Investigator Intelligence</span>
          </button>
        </nav>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <div class="workspace-title">
            <span class="workspace-kicker">ATLAS / INVESTIGATION WORKSPACE</span>
            <strong>Threat Intelligence Console</strong>
          </div>

          <label class="search-box" aria-label="Global search">
            <span class="search-icon">⌕</span>
            <input id="global-search" type="search" placeholder="Search actors, personas, evidence..." />
          </label>

          <div class="header-meta">
            <span class="demo-badge">DEMO ENVIRONMENT · SYNTHETIC DATA</span>
            <div class="status-strip">
              <span><em class="status-dot green"></em>System Status</span>
              <span><em class="status-dot blue"></em>Data Status</span>
            </div>
            <div class="export-actions" aria-label="Export investigation">
              <a href="/v1/investigator/export.json" target="_blank" rel="noopener noreferrer">JSON</a>
              <a href="/v1/investigator/export.csv" target="_blank" rel="noopener noreferrer">CSV</a>
              <a href="/v1/investigator/export.pdf" target="_blank" rel="noopener noreferrer">PDF</a>
            </div>
          </div>
        </header>

        <main class="page-shell">
          <div id="workspace-status" class="workspace-status" aria-live="polite"></div>
          <section id="overview-page" class="page-section active" aria-live="polite"></section>
          <section id="evidence-page" class="page-section" aria-live="polite"></section>
          <section id="sources-page" class="page-section" aria-live="polite"></section>
          <section id="conflicts-page" class="page-section" aria-live="polite"></section>
          <section id="correlations-page" class="page-section" aria-live="polite"></section>
          <section id="actors-page" class="page-section" aria-live="polite"></section>
          <section id="identity-links-page" class="page-section" aria-live="polite"></section>
          <section id="false-links-page" class="page-section" aria-live="polite"></section>
          <section id="personas-page" class="page-section" aria-live="polite"></section>
          <section id="stylometry-page" class="page-section" aria-live="polite"></section>
          <section id="behavior-page" class="page-section" aria-live="polite"></section>
          <section id="migration-page" class="page-section" aria-live="polite"></section>
          <section id="reliability-page" class="page-section" aria-live="polite"></section>
          <section id="cas-page" class="page-section" aria-live="polite"></section>
          <section id="graph-page" class="page-section" aria-live="polite"></section>
          <section id="timeline-page" class="page-section" aria-live="polite"></section>
          <section id="audit-page" class="page-section" aria-live="polite"></section>
          <section id="reports-page" class="page-section" aria-live="polite"></section>
          <section id="search-page" class="page-section" aria-live="polite"></section>
        </main>
      </div>
    </div>

    <script src="/ui/app.js"></script>
  </body>
</html>
